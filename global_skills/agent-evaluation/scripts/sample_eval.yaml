# Sample Eval Suite for THE DUDE lead scoring
# Usage: python main.py run sample_eval.yaml

name: "lead-scorer-eval"
model: "llama3.1:8b"
runs: 3

tests:
  - name: "scores_valid_business"
    prompt: |
      You are a lead scoring agent. Score this lead from 0 to 100 based on
      relevance and potential value. Output only a JSON with "score" and "reasoning".

      Lead: "Digital Marketing Agency, 15 employees, based in Madrid, Spain.
      Website shows they serve 50+ clients. Looking for automation solutions."
    invariants:
      - contains: "score"
      - not_contains: "I don't know"
      - max_length: 1000

  - name: "rejects_irrelevant_lead"
    prompt: |
      You are a lead scoring agent. Score this lead from 0 to 100 based on
      relevance for B2B AI services. Output only a JSON with "score" and "reasoning".

      Lead: "Local bakery, 2 employees, no website, cash-only business."
    invariants:
      - contains: "score"
      - max_length: 1000

  - name: "handles_empty_input"
    prompt: |
      You are a lead scoring agent. Score this lead from 0 to 100.
      Output only a JSON with "score" and "reasoning".

      Lead: ""
    invariants:
      - max_length: 500
      - not_contains: "ERROR"

  - name: "provides_structured_output"
    prompt: |
      You are a lead scoring agent. You MUST output ONLY valid JSON.
      Format: {"score": <0-100>, "reasoning": "<text>"}

      Lead: "Software consultancy in Barcelona, 30 employees, uses AI internally."
    invariants:
      - contains: "score"
      - contains: "reasoning"
      - max_length: 800
