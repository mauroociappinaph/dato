name: 🧪 Test Suite

on:
  push:
    branches: [main, develop]
    paths:
      - "global_skills/**"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "global_skills/**"
  schedule:
    # Run nightly tests at 2 AM UTC
    - cron: "0 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =============================================================================
  # Lint & Format Check
  # =============================================================================
  lint:
    name: 🎨 Lint & Format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./global_skills

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install black flake8 mypy isort

      - name: Check code formatting (black)
        run: black --check --diff .
        continue-on-error: true

      - name: Check import sorting (isort)
        run: isort --check-only --diff .
        continue-on-error: true

      - name: Lint with flake8
        run: flake8 . --count --max-complexity=10 --statistics
        continue-on-error: true

      - name: Type check with mypy
        run: mypy --ignore-missing-imports .
        continue-on-error: true

  # =============================================================================
  # Unit Tests
  # =============================================================================
  unit-tests:
    name: 🔬 Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    defaults:
      run:
        working-directory: ./global_skills

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run unit tests
        run: |
          python scripts/run_tests.py --unit

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-py${{ matrix.python-version }}
          path: global_skills/test_report.json
          retention-days: 7

  # =============================================================================
  # Integration Tests
  # =============================================================================
  integration-tests:
    name: 🔗 Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    defaults:
      run:
        working-directory: ./global_skills

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run integration tests
        run: |
          python scripts/run_tests.py --integration

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: global_skills/test_report.json
          retention-days: 7

  # =============================================================================
  # Skills Validation
  # =============================================================================
  validate-skills:
    name: ✅ Validate Skills
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./global_skills

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate all skills
        run: |
          python scripts/run_tests.py --validate

  # =============================================================================
  # Architecture Tests
  # =============================================================================
  architecture-tests:
    name: 🏗️ Architecture Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./global_skills

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run architecture tests
        run: |
          python scripts/run_tests.py --architecture

  # =============================================================================
  # Coverage Report
  # =============================================================================
  coverage:
    name: 📊 Coverage
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests]
    defaults:
      run:
        working-directory: ./global_skills

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"

      - name: Run tests with coverage
        run: |
          python scripts/run_tests.py --all --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: global_skills/coverage.xml
          fail_ci_if_error: false
          verbose: true
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload HTML coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: global_skills/htmlcov/
          retention-days: 7

  # =============================================================================
  # Test Summary
  # =============================================================================
  summary:
    name: 📝 Test Summary
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, validate-skills, architecture-tests]
    if: always()

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create summary
        run: |
          echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.unit-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Skills Validation | ${{ needs.validate-skills.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Architecture Tests | ${{ needs.architecture-tests.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📊 [View Coverage Report](https://codecov.io/gh/${{ github.repository }})" >> $GITHUB_STEP_SUMMARY
